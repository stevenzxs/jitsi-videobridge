name: Publish GM artifact to GitHub Packages

on:
  workflow_dispatch:
  push:
    branches:
      - gm-sm4-srtp

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GH_PACKAGES_TOKEN
          cache: maven

      - name: Build jitsi-videobridge-gm
        run: >-
          mvn --batch-mode --no-transfer-progress
          -DskipTests
          -Dcheckstyle.skip=true
          -Dspotbugs.skip=true
          -Dktlint.skip=true
          package

      - name: Publish Maven artifacts
        run: >-
          mvn --batch-mode --no-transfer-progress
          -DskipTests
          -Dcheckstyle.skip=true
          -Dspotbugs.skip=true
          -Dktlint.skip=true
          deploy

      - name: Upload runtime archive
        uses: actions/upload-artifact@v4
        with:
          name: jitsi-videobridge-gm
          path: jvb/target/jitsi-videobridge-gm-2.3-SNAPSHOT-archive.zip
